<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Violet Background Gradient -->
    <linearGradient id="violetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E0A38" />
      <stop offset="50%" stop-color="#3B1578" />
      <stop offset="100%" stop-color="#5B21B6" />
    </linearGradient>

    <!-- Bracket Highlight Gradient -->
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>

    <!-- Slash Accent Gradient -->
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
  </defs>

  <!-- Square Base Container (Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#violetBg)" />

  <!-- Code Symbol Icon </ > -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Bracket < -->
    <path d="M 170 180 L 90 256 L 170 332" fill="none" stroke="url(#bracketGrad)" stroke-width="44" />

    <!-- Slash / -->
    <path d="M 285 140 L 227 372" fill="none" stroke="url(#slashGrad)" stroke-width="44" />

    <!-- Right Bracket > -->
    <path d="M 342 180 L 422 256 L 342 332" fill="none" stroke="url(#bracketGrad)" stroke-width="44" />
  </g>
</svg>
